<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Science Lesson Studio · 과학교육론 · 과학교과교수법</title>
    <meta
      name="description"
      content="경희대학교 과학교육론·과학교과교수법 18차시 강의를 진행하고 수강생의 생각 변화를 기록하는 웹앱"
    />
    <!--
      DESIGN.md는 figmaSans / figmaMono를 쓰고, 없으면 Inter / JetBrains Mono로 대체하라고 적었다.
      다만 Inter에는 한글 글자가 없다. 화면 문구가 전부 한국어이므로 한글은 Pretendard로 받는다.
      Pretendard는 Inter와 같은 x-height·굵기 축을 목표로 만든 한국어 서체라서
      DESIGN.md가 요구한 320~700 사이 미세 굵기 단계를 그대로 쓸 수 있다.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
